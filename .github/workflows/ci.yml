name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build-storybook
      - run: npx playwright install chromium && npm run test:storybook

  build-and-audit:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Bundle analysis
        run: npm run analyze
      - uses: actions/upload-artifact@v4
        with: { name: bundle-analysis, path: .next/diagnostics/analyze }
      - name: Accessibility (axe) on every route
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Lighthouse CI
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
